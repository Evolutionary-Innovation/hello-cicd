name: Deploy Application

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  id-token: write
  contents: read
        
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Server IP
        working-directory: terraform
        run: |
          terraform init -reconfigure
          terraform state list
          echo "SERVER_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV

      - name: Create SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/hello-cicd
          chmod 600 ~/.ssh/hello-cicd

      - name: Add Host Key
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Create Application Directory
        run: |
          ssh -i ~/.ssh/hello-cicd ec2-user@$SERVER_IP \
          "mkdir -p /home/ec2-user/app"

      - name: Copy Application
        run: |
          scp -i ~/.ssh/hello-cicd \
          -r app/* \
          ec2-user@$SERVER_IP:/home/ec2-user/app/

      - name: Build And Deploy Container
        run: |
          ssh -i ~/.ssh/hello-cicd ec2-user@$SERVER_IP "
            cd /home/ec2-user/app &&

            docker stop hello-cicd || true &&
            docker rm hello-cicd || true &&

            docker build -t hello-cicd . &&

            docker run -d \
              --name hello-cicd \
              --restart unless-stopped \
              -p 3000:3000 \
              hello-cicd
          "