name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (git SHA) to deploy. Blank = this commit. Use an older SHA to roll back.
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: Image tag (git SHA) to deploy, normally the one built by the previous stage
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/terraform-outputs

      - name: Create SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add Host Key
        run: |
          ssh-keyscan -H "$PUBLIC_IP" >> ~/.ssh/known_hosts

      - name: Record Previous Image
        id: prev
        run: |
          PREV="$(ssh -i ~/.ssh/deploy_key "ec2-user@$PUBLIC_IP" \
            "docker inspect --format '{{.Config.Image}}' $CONTAINER_NAME 2>/dev/null || true")"
          echo "Previous image: ${PREV:-none}"
          echo "image=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy Container
        id: deploy
        run: |
          REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          IMAGE="$ECR_REPOSITORY_URL:${{ inputs.image_tag || github.sha }}"
          echo "Deploying $IMAGE"

          ssh -i ~/.ssh/deploy_key "ec2-user@$PUBLIC_IP" "
            aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $REGISTRY &&

            docker pull $IMAGE &&

            docker stop $CONTAINER_NAME || true &&
            docker rm $CONTAINER_NAME || true &&

            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $APP_PORT:3000 \
              $IMAGE
          "

      - name: Health Check
        id: health
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          URL="http://$PUBLIC_IP:$APP_PORT/health"

          for attempt in $(seq 1 18); do
            BODY="$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)"
            echo "attempt $attempt: ${BODY:-no response}"
            if [ "$(echo "$BODY" | jq -r '.status + ":" + .sha' 2>/dev/null)" = "ok:$TAG" ]; then
              echo "Healthy and running $TAG"
              exit 0
            fi
            sleep 5
          done

          echo "::error::$URL did not report ok:$TAG within 90s"
          ssh -i ~/.ssh/deploy_key "ec2-user@$PUBLIC_IP" "docker logs --tail 50 $CONTAINER_NAME" || true
          exit 1

      - name: Roll Back
        if: always() && steps.prev.outputs.image != '' && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
        run: |
          REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          PREV_TAG="${PREV_IMAGE##*:}"
          echo "::warning::Deployment failed; rolling back to $PREV_IMAGE"

          ssh -i ~/.ssh/deploy_key "ec2-user@$PUBLIC_IP" \
            bash -s "$PREV_IMAGE" "$CONTAINER_NAME" "$APP_PORT" "$AWS_REGION" "$REGISTRY" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; NAME="$2"; PORT="$3"; REGION="$4"; REGISTRY="$5"

          if [ "$(docker inspect --format '{{.Config.Image}} {{.State.Running}}' "$NAME" 2>/dev/null || true)" = "$IMAGE true" ]; then
            echo "$IMAGE is already running; nothing to roll back"
            exit 0
          fi

          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$IMAGE"
          docker rm -f "$NAME" || true
          docker run -d --name "$NAME" --restart unless-stopped -p "$PORT:3000" "$IMAGE"
          REMOTE

          URL="http://$PUBLIC_IP:$APP_PORT"
          for attempt in $(seq 1 12); do
            BODY="$(curl -fsS --max-time 5 "$URL/health" 2>/dev/null || true)"
            echo "rollback check $attempt: ${BODY:-no /health response}"
            if [ "$(echo "$BODY" | jq -r '.status + ":" + .sha' 2>/dev/null)" = "ok:$PREV_TAG" ]; then
              echo "### Rolled back to \`$PREV_TAG\`" >> "$GITHUB_STEP_SUMMARY"
              echo "Rollback verified: $PREV_TAG is healthy"
              exit 0
            fi
            # images built before /health existed: accept a 200 on /
            if [ -z "$BODY" ] && curl -fsS --max-time 5 -o /dev/null "$URL/"; then
              echo "### Rolled back to \`$PREV_TAG\` (no /health in that image)" >> "$GITHUB_STEP_SUMMARY"
              echo "Rollback verified via / (image predates /health)"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Rollback to $PREV_IMAGE could not be verified"
          exit 1
