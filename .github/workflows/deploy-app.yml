name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (git SHA) to deploy. Blank = this commit. Use an older SHA to roll back.
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: Image tag (git SHA) to deploy, normally the one built by the previous stage
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/terraform-outputs

      - name: Create SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add Host Key
        run: |
          ssh-keyscan -H "$PUBLIC_IP" >> ~/.ssh/known_hosts

      - name: Deploy Container
        run: |
          REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          IMAGE="$ECR_REPOSITORY_URL:${{ inputs.image_tag || github.sha }}"
          echo "Deploying $IMAGE"

          ssh -i ~/.ssh/deploy_key "ec2-user@$PUBLIC_IP" "
            aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $REGISTRY &&

            docker pull $IMAGE &&

            docker stop $CONTAINER_NAME || true &&
            docker rm $CONTAINER_NAME || true &&

            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $APP_PORT:3000 \
              $IMAGE
          "

      - name: Health Check
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          URL="http://$PUBLIC_IP:$APP_PORT/health"

          for attempt in $(seq 1 18); do
            BODY="$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)"
            echo "attempt $attempt: ${BODY:-no response}"
            if [ "$(echo "$BODY" | jq -r '.status + ":" + .sha' 2>/dev/null)" = "ok:$TAG" ]; then
              echo "Healthy and running $TAG"
              exit 0
            fi
            sleep 5
          done

          echo "::error::$URL did not report ok:$TAG within 90s"
          ssh -i ~/.ssh/deploy_key "ec2-user@$PUBLIC_IP" "docker logs --tail 50 $CONTAINER_NAME" || true
          exit 1
