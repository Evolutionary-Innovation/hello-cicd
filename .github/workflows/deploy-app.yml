name: Deploy Application

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  id-token: write
  contents: read
        
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Server IP
        working-directory: terraform
        run: |
          terraform init -reconfigure
          terraform state list
          echo "SERVER_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV

      - name: Create SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/hello-cicd
          chmod 600 ~/.ssh/hello-cicd

      - name: Add Host Key
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Deploy Container
        run: |
          ssh -i ~/.ssh/hello-cicd ec2-user@$SERVER_IP "
            aws ecr get-login-password --region eu-west-2 | \
            docker login --username AWS --password-stdin 394495726863.dkr.ecr.eu-west-2.amazonaws.com &&

            docker pull 394495726863.dkr.ecr.eu-west-2.amazonaws.com/hello-cicd:latest &&

            docker stop hello-cicd || true &&
            docker rm hello-cicd || true &&

            docker run -d \
              --name hello-cicd \
              --restart unless-stopped \
              -p 3000:3000 \
              394495726863.dkr.ecr.eu-west-2.amazonaws.com/hello-cicd:latest
          "