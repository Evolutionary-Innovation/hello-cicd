name: Build Image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image_tag:
        description: Tag (git SHA) of the image in ECR for this commit
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/terraform-outputs

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build And Push
        run: |
          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY_NAME" \
              --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $GITHUB_SHA already in ECR (tags are immutable); skipping push"
            exit 0
          fi

          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$ECR_REPOSITORY_URL:$GITHUB_SHA" ./src
          docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"
