name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Dump GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"

      - name: Request OIDC Token
        run: |
          echo "OIDC available"
          env | grep ACTIONS_ID_TOKEN || true
          echo "OIDC Token: $ACTIONS_ID_TOKEN"
          echo "OIDC Token Expiration: $ACTIONS_ID_TOKEN_EXPIRATION"
          echo "OIDC Token Audience: $ACTIONS_ID_TOKEN_AUDIENCE"
          echo "OIDC Token Issuer: $ACTIONS_ID_TOKEN_ISSUER"
          echo "OIDC Token Subject: $ACTIONS_ID_TOKEN_SUBJECT"
          echo "OIDC Token Not Before: $ACTIONS_ID_TOKEN_NOT_BEFORE"
          echo "OIDC Token Expired: $ACTIONS_ID_TOKEN_EXPIRED"