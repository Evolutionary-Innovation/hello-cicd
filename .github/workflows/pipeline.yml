name: Pipeline

on:
  # PUSH-TRIGGER: manual-only until a project is configured. scripts/configure-project.sh
  # enables the push trigger below; do not enable it before bootstrap/ is applied and
  # the AWS_ROLE_ARN / AWS_REGION repository variables are set.
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - "docs/**"
  #     - "**/*.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  infrastructure:
    uses: ./.github/workflows/infrastructure.yml
    secrets: inherit

  build:
    needs: infrastructure
    uses: ./.github/workflows/build-image.yml
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-app.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
